################
### MONITORS ###
################

# See https://wiki.hypr.land/Configuring/Monitors/
monitor=eDP-1,2880x1800@120,0x0,2,vrr,3
monitor=,preferred,auto,auto


###################
### MY PROGRAMS ###
###################

# See https://wiki.hypr.land/Configuring/Keywords/

$terminal = ghostty
$fileManager = dolphin
$browser = flatpak run app.zen_browser.zen
$btGui = blueman-manager
$tg = dex /usr/share/applications/org.telegram.desktop.desktop
$resMonitor = btop
$ubuntu24 = distrobox enter ubuntu-24


#################
### AUTOSTART ###
#################

exec-once = waybar
exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP
exec-once = clipse -listen
exec-once = swaync
exec-once = swaybg -i /home/litt/Pictures/space/Orion1.jpg -m fill


#############################
### ENVIRONMENT VARIABLES ###
